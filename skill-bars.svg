    <text x="40" y="180" fill="#39ff14">AGILITY</text>
    <text x="170" y="180" fill="#8b949e" font-size="12" font-weight="400">Frontend / UI</text>
    <rect x="280" y="166" width="460" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect x="283" y="169" width="272" height="12" rx="6" fill="url(#g3)" filter="url(#glow2)"/>
    <text x="760" y="180" fill="#ffffff">60%</text>

    <text x="40" y="220" fill="#ffd700">WISDOM</text>
    <text x="160" y="220" fill="#8b949e" font-size="12" font-weight="400">App Development</text>
    <rect x="280" y="206" width="460" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect x="283" y="209" width="317" height="12" rx="6" fill="url(#g4)" filter="url(#glow2)"/>
    <text x="760" y="220" fill="#ffffff">70%</text>

    <text x="40" y="260" fill="#b967ff">LUCK</text>
    <text x="140" y="260" fill="#8b949e" font-size="12" font-weight="400">Debugging RNG</text>
    <rect x="280" y="246" width="460" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
