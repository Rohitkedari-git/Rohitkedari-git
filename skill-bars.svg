    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg2)"/>
  <rect x="4" y="4" width="892" height="292" rx="15" fill="none" stroke="#ff007f" stroke-opacity="0.4" stroke-width="1.5"/>

  <text x="40" y="45" font-family="'Courier New', monospace" font-size="24" font-weight="700" fill="#ffffff" filter="url(#glow2)">📊 STAT POINTS</text>
  <line x1="40" y1="58" x2="860" y2="58" stroke="#30363d" stroke-width="1"/>

  <!-- bar template: label at x=40, bar starts x=280 width=460, value text at x=760 -->
  <g font-family="'Courier New', monospace" font-size="15" font-weight="700">

    <text x="40" y="100" fill="#00f0ff">STRENGTH</text>
    <text x="180" y="100" fill="#8b949e" font-size="12" font-weight="400">Backend Logic</text>
    <rect x="280" y="86" width="460" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect x="283" y="89" width="362" height="12" rx="6" fill="url(#g1)" filter="url(#glow2)"/>
    <text x="760" y="100" fill="#ffffff">80%</text>

    <text x="40" y="140" fill="#ff007f">INTELLIGENCE</text>
